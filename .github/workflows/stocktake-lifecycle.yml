name: Stocktake lifecycle regression

on:
  push:
    branches:
      - 'fix/restore-per-product-stocktake-workspace-20261104'
      - 'fix/stocktake-embedded-bulk-counting-20261105'
  pull_request:
    paths:
      - 'app/Services/StockCountDocumentService.php'
      - 'app/Services/StocktakeCategoryWorkspaceService.php'
      - 'app/Http/Controllers/StocktakeController.php'
      - 'resources/views/stocktake/form.blade.php'
      - 'resources/views/stocktake/index.blade.php'
      - 'public/js/stocktake-category-workspace.js'
      - 'tests/Js/stocktake-category-workspace.test.cjs'
      - 'tests/Feature/StockCountLifecycleSafetyTest.php'
      - 'tests/Feature/StocktakeCategoryDraftValidationTest.php'
      - 'tests/Unit/StockCountQuantityCalculatorTest.php'
      - 'tests/Feature/StocktakeArchiveFiltersTest.php'
      - '.github/workflows/stocktake-lifecycle.yml'

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, gd, pdo, sqlite, pdo_sqlite
          coverage: none
      - run: node --test tests/Js/stocktake-category-workspace.test.cjs
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php vendor/bin/pest tests/Feature/StockCountLifecycleSafetyTest.php tests/Feature/StocktakeArchiveFiltersTest.php tests/Feature/StocktakeCategoryDraftValidationTest.php tests/Unit/StockCountQuantityCalculatorTest.php --stop-on-failure --display-errors
