name: Stocktake snapshot schema safety

on:
  pull_request:
    paths:
      - 'database/migrations/2026_10_29_000001_add_bundle_snapshots_to_stock_count_items.php'
      - 'tests/Feature/StocktakeSnapshotSchemaMigrationTest.php'
      - 'tests/Integration/stocktake_snapshot_mariadb_smoke.php'
      - '.github/workflows/stocktake-snapshot-schema.yml'
  push:
    branches: [main]
    paths:
      - 'database/migrations/2026_10_29_000001_add_bundle_snapshots_to_stock_count_items.php'
      - 'tests/Feature/StocktakeSnapshotSchemaMigrationTest.php'
      - 'tests/Integration/stocktake_snapshot_mariadb_smoke.php'
      - '.github/workflows/stocktake-snapshot-schema.yml'

permissions:
  contents: read

jobs:
  migration-fixture:
    name: Existing snapshot migration on isolated SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Ensure non-production test configuration
        run: |
          test ! -f .env
          test "$(php -r 'echo extension_loaded("pdo_sqlite") ? "yes" : "no";')" = "yes"
      - name: Verify migration and fixture syntax
        run: |
          php -l database/migrations/2026_10_29_000001_add_bundle_snapshots_to_stock_count_items.php
          php -l tests/Feature/StocktakeSnapshotSchemaMigrationTest.php
      - name: Verify legacy count preservation and idempotence
        run: php artisan test --filter=StocktakeSnapshotSchemaMigrationTest
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

  mariadb-fixture:
    name: Existing snapshot migration on disposable MariaDB 10.11
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-only-password
          MARIADB_DATABASE: stocktake_snapshot_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CI: 'true'
      APP_ENV: testing
      APP_KEY: 'base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE='
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: stocktake_snapshot_ci
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Verify database smoke script syntax
        run: php -l tests/Integration/stocktake_snapshot_mariadb_smoke.php
      - name: Run real MariaDB protected-snapshot migration on fixture rows
        run: php tests/Integration/stocktake_snapshot_mariadb_smoke.php
