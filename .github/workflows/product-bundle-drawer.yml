name: Product bundle details drawer

on:
  pull_request:
    paths:
      - 'app/Http/Controllers/ProductController.php'
      - 'app/Support/PageAccessCatalog.php'
      - 'routes/web.php'
      - 'resources/views/products/index.blade.php'
      - 'public/js/product-bundle-drawer.js'
      - 'public/css/product-bundle-drawer.css'
      - 'tests/Feature/LargeProductBundleTest.php'
      - '.github/workflows/product-bundle-drawer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-drawer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, gd, pdo, sqlite, pdo_sqlite
          coverage: none
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Build Vite manifest for Laravel view tests
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify PHP and browser JS syntax
        run: |
          php -l app/Http/Controllers/ProductController.php
          php -l app/Support/PageAccessCatalog.php
          php -l routes/web.php
          node --check public/js/product-bundle-drawer.js
      - name: Test lazy paginated bundle details and existing bundle flow
        run: php artisan test tests/Feature/LargeProductBundleTest.php
      - name: Product listing regressions
        run: php artisan test tests/Feature/ProductSearchTest.php
