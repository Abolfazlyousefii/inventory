name: Inventory safety

on:
  push:
    branches: [main]
    paths: ['app/**', 'tests/**', 'database/**', 'composer.*', 'phpunit.xml', '.github/workflows/inventory-safety.yml']
  pull_request:
    paths: ['app/**', 'tests/**', 'database/**', 'composer.*', 'phpunit.xml', '.github/workflows/inventory-safety.yml']

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, gd, pdo, sqlite, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php tests/run-inventory.php --log-junit inventory-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-results-php-${{ matrix.php }}
          path: inventory-results.xml
