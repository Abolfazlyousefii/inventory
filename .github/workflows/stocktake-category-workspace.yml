name: Stocktake category workspace

on:
  pull_request:
    paths:
      - 'app/Http/Controllers/StocktakeController.php'
      - 'app/Services/StocktakeCategoryWorkspaceService.php'
      - 'app/Services/StockCountDocumentService.php'
      - 'tests/Feature/StockCountLifecycleSafetyTest.php'
      - 'tests/Js/stocktake-live-search.test.cjs'
      - 'app/Support/PageAccessCatalog.php'
      - 'routes/web.php'
      - 'resources/views/stocktake/**'
      - 'public/js/stocktake-category-workspace.js'
      - 'tests/Feature/StocktakeCategoryWorkspaceTest.php'
      - 'tests/Js/stocktake-category-workspace.test.cjs'
      - 'tests/Js/stocktake-category-layout.test.cjs'
      - '.github/workflows/stocktake-category-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  category-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, gd, pdo, sqlite, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: |
          cp .env.example .env
          php artisan key:generate
      - run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: PHP and JS syntax
        run: |
          php -l app/Services/StocktakeCategoryWorkspaceService.php
          php -l app/Services/StockCountDocumentService.php
          php -l app/Http/Controllers/StocktakeController.php
          php -l app/Support/PageAccessCatalog.php
          php -l routes/web.php
          node --check public/js/stocktake-category-workspace.js
      - name: Category search and transactional finalization safety
        run: php artisan test tests/Feature/StocktakeCategoryWorkspaceTest.php
      - name: Stocktake completion gate and stale-count rollback
        run: php artisan test tests/Feature/StockCountLifecycleSafetyTest.php
      - name: Inventory count freeze and stock mutation guards
        run: php artisan test tests/Feature/InventoryCountFreezeTest.php
      - name: Existing stocktake inline behaviors
        run: node --test tests/Js/stocktake-inline-flow.test.cjs tests/Js/stocktake-category-workspace.test.cjs tests/Js/stocktake-live-search.test.cjs tests/Js/stocktake-category-layout.test.cjs
