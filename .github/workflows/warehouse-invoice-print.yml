name: Warehouse invoice print regression

on:
  push:
    branches: [main]
    paths:
      - 'resources/views/prints/invoice.blade.php'
      - 'resources/views/prints/partials/customer-invoice-items.blade.php'
      - 'resources/views/prints/partials/sales-invoice-template.blade.php'
      - 'app/Services/SalesPrintDocumentService.php'
      - 'app/Support/SalesDocumentTotals.php'
      - 'tests/Feature/SalesPrintDiscountSummaryTest.php'
      - 'tests/Feature/CustomerInvoicePrintBalanceTest.php'
      - '.github/workflows/warehouse-invoice-print.yml'
  pull_request:
    paths:
      - 'resources/views/prints/invoice.blade.php'
      - 'resources/views/prints/partials/customer-invoice-items.blade.php'
      - 'resources/views/prints/partials/sales-invoice-template.blade.php'
      - 'app/Services/SalesPrintDocumentService.php'
      - 'app/Support/SalesDocumentTotals.php'
      - 'tests/Feature/SalesPrintDiscountSummaryTest.php'
      - 'tests/Feature/CustomerInvoicePrintBalanceTest.php'
      - '.github/workflows/warehouse-invoice-print.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invoice-print:
    name: Invoice print PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, gd, pdo, sqlite, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: PHP syntax checks
        run: |
          php -l app/Services/SalesPrintDocumentService.php
          php -l app/Support/SalesDocumentTotals.php
          php -l tests/Feature/SalesPrintDiscountSummaryTest.php
          php -l tests/Feature/CustomerInvoicePrintBalanceTest.php
      - name: Invoice pricing and warehouse/customer print regression
        run: php tests/run.php --configuration phpunit.xml tests/Feature/SalesPrintDiscountSummaryTest.php tests/Feature/CustomerInvoicePrintBalanceTest.php
