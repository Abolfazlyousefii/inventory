name: Finance review reason regression checks

on:
  pull_request:
    paths:
      - 'app/Http/Requests/FinanceUpdatePreinvoiceRequest.php'
      - 'app/Services/FinancePreinvoiceEditorService.php'
      - 'resources/views/preinvoice/finance-edit.blade.php'
      - 'public/js/finance-review.js'
      - 'tests/Feature/FinancePreinvoiceUpdateTest.php'
      - 'tests/Feature/FinancePreinvoiceUpdateValidationTest.php'
      - 'tests/Feature/WarehouseReservationFullLifecycleTest.php'
      - '.github/workflows/finance-review-reason-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, gd, pdo, sqlite, pdo_sqlite
          coverage: none
      - name: Composer install
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare testing environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Compile web assets
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Check finance-review PHP syntax
        run: |
          php -l app/Http/Requests/FinanceUpdatePreinvoiceRequest.php
          php -l app/Services/FinancePreinvoiceEditorService.php
      - name: Finance review regression tests
        run: php artisan test tests/Feature/FinancePreinvoiceUpdateTest.php tests/Feature/FinancePreinvoiceUpdateValidationTest.php
      - name: Verify unchanged approval through full inventory lifecycle
        run: php artisan test tests/Feature/WarehouseReservationFullLifecycleTest.php --filter="approves an unchanged finance preinvoice without a reason"
