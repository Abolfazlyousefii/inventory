name: Incoming shipping invoices
on:
  pull_request:
    paths:
      - 'app/Http/Controllers/WarehouseShippingController.php'
      - 'app/Support/PageAccessCatalog.php'
      - 'routes/web.php'
      - 'resources/views/warehouse/shipping/**'
      - 'public/js/shipping-incoming.js'
      - 'public/css/shipping-incoming.css'
      - 'tests/Feature/ShippingIncomingInvoicesTest.php'
      - 'tests/Js/shipping-incoming.test.cjs'
      - '.github/workflows/shipping-incoming.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  incoming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, gd, pdo, sqlite, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: |
          cp .env.example .env
          php artisan key:generate
          npm ci --no-audit --no-fund
          npm run build
      - run: php tests/run.php --configuration phpunit.xml tests/Feature/ShippingIncomingInvoicesTest.php tests/Feature/NonSalesVoucherAccessTest.php tests/Feature/AccountStatementReadOnlyAccessTest.php
      - run: node --test tests/Js/shipping-incoming.test.cjs
