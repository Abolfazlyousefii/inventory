name: Showroom voucher regression checks
on:
  pull_request:
    paths:
      - 'app/Http/Controllers/VoucherController.php'
      - 'app/Models/WarehouseTransfer.php'
      - 'app/Services/WarehouseStockService.php'
      - 'app/Services/InventoryCountFreezeService.php'
      - 'app/Services/Sync/InventoryProductsSyncService.php'
      - 'resources/views/vouchers/showroom/**'
      - 'resources/views/vouchers/transfer/**'
      - 'resources/views/vouchers/hub.blade.php'
      - 'database/migrations/*showroom*'
      - 'tests/Feature/ShowroomVoucherTest.php'
      - '.github/workflows/showroom-vouchers-targeted.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  showroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, gd, pdo, sqlite, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: |
          cp .env.example .env
          php artisan key:generate
      - name: Transfer, retry, rollback and count freeze boundaries
        run: php tests/run.php --configuration phpunit.xml tests/Feature/ShowroomVoucherTest.php tests/Feature/PersonnelVoucherManagementTest.php tests/Feature/InventoryCountFreezeTest.php tests/Feature/SalesReturnNewProductWarehouseStockRegressionTest.php tests/Feature/PreinvoiceScopedReservationSyncTest.php
