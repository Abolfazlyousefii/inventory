name: Stocktake isolated snapshot test runner

on:
  pull_request:
    paths:
      - 'tests/run-stocktake-isolated.sh'
      - 'tests/run.php'
      - 'tests/bootstrap.php'
      - '.github/workflows/stocktake-isolated-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, gd, pdo, sqlite, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare isolated web assets
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify snapshot uses its own Pest bootstrap and SQLite memory
        run: bash tests/run-stocktake-isolated.sh "$PWD" HEAD
