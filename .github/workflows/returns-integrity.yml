name: Returns inventory and financial integrity

on:
  pull_request:
    paths:
      - 'app/**'
      - 'database/migrations/**'
      - 'resources/views/**'
      - 'public/js/purchase-returns.js'
      - 'tests/**'
      - '.github/workflows/returns-integrity.yml'
  push:
    branches: ['codex/returns-inventory-ledger-audit']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  returns:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    name: Returns regression PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, gd, pdo, sqlite, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: php tests/run-returns-regression.php
      - run: node --test tests/Js/purchase-return-net-pricing.test.cjs
