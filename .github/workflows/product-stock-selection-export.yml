name: Product stock selection export

on:
  pull_request:
    paths:
      - 'app/Http/Controllers/ProductSelectedStockExportController.php'
      - 'app/Http/Controllers/ProductSelectionExportController.php'
      - 'app/Services/ProductSelectedStockExportService.php'
      - 'public/js/product-selection-export.js'
      - 'public/js/product-stock-csv.js'
      - 'resources/views/products/index.blade.php'
      - 'routes/web.php'
      - 'tests/Feature/ProductSelectedStockRowsExportTest.php'
      - 'tests/Feature/ProductSelectionExportTest.php'
      - 'tests/Js/product-stock-export.test.cjs'
      - '.github/workflows/product-stock-selection-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected-stock-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, gd, pdo, sqlite, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: |
          cp .env.example .env
          php artisan key:generate
      - name: Selected stock variants and legacy PDF regression
        run: php artisan test tests/Feature/ProductSelectedStockRowsExportTest.php tests/Feature/ProductSelectionExportTest.php
      - name: CSV escaping and pagination tests
        run: node --test tests/Js/product-stock-export.test.cjs
