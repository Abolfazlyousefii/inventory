name: Purchase sale price regression (temporary PR validation)

on:
  pull_request:
    paths:
      - 'app/Http/Controllers/PurchaseController.php'
      - 'resources/views/purchases/create.blade.php'
      - 'tests/Feature/PurchaseSalePriceSafetyTest.php'
      - '.github/workflows/purchase-sale-price-regression-temp.yml'

permissions:
  contents: read

jobs:
  purchase-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none
      - name: PHP lint
        run: |
          php -l app/Http/Controllers/PurchaseController.php
          php -l tests/Feature/PurchaseSalePriceSafetyTest.php
      - name: Work around pre-existing composer lock mismatch in isolated runner only
        run: |
          php -r '$j = json_decode(file_get_contents("composer.json"), true); unset($j["require"]["fruitcake/laravel-debugbar"]); file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));'
          composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Execute isolated purchase price tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test tests/Feature/PurchaseSalePriceSafetyTest.php --stop-on-failure
