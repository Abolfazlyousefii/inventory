name: Stock print preview

on:
  pull_request:
    paths:
      - 'resources/views/products/index.blade.php'
      - 'resources/views/products/stock-print.blade.php'
      - 'app/Http/Controllers/ProductSelectedStockExportController.php'
      - 'app/Services/ProductSearchService.php'
      - 'app/Support/PageAccessCatalog.php'
      - 'routes/web.php'
      - 'public/js/product-selection-export.js'
      - 'public/js/product-stock-print.js'
      - 'public/css/products-mobile-compact.css'
      - 'tests/Feature/ProductSelectedStockRowsExportTest.php'
      - 'tests/Js/product-stock-print.test.cjs'
      - '.github/workflows/product-stock-print-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  print-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, gd, pdo, sqlite, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Build Vite manifest for Blade tests
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Syntax
        run: |
          php -l app/Http/Controllers/ProductSelectedStockExportController.php
          node --check public/js/product-selection-export.js
          node --check public/js/product-stock-print.js
      - name: Stock print and selection regressions
        run: php artisan test tests/Feature/ProductSelectedStockRowsExportTest.php tests/Feature/ProductSelectionExportTest.php
      - name: Print progress, complete-data gate and error resilience
        run: node --test tests/Js/product-stock-print.test.cjs
