name: Unified person account statements

on:
  pull_request:
    paths:
      - 'app/Http/Controllers/PersonController.php'
      - 'app/Models/Supplier.php'
      - 'app/Models/SupplierLedger.php'
      - 'app/Models/SupplierAccountTransaction.php'
      - 'app/Support/PermissionCatalog.php'
      - 'app/Support/PageAccessCatalog.php'
      - 'database/migrations/2026_11_11_170000_create_supplier_account_transactions_table.php'
      - 'resources/views/persons/**'
      - 'routes/web.php'
      - 'tests/Feature/UnifiedPersonAccountStatementTest.php'
      - '.github/workflows/unified-person-account-statement.yml'
  push:
    branches:
      - 'feat/unified-person-account-statements'
    paths:
      - 'app/Http/Controllers/PersonController.php'
      - 'app/Models/Supplier.php'
      - 'app/Models/SupplierLedger.php'
      - 'app/Models/SupplierAccountTransaction.php'
      - 'app/Support/PermissionCatalog.php'
      - 'app/Support/PageAccessCatalog.php'
      - 'database/migrations/2026_11_11_170000_create_supplier_account_transactions_table.php'
      - 'resources/views/persons/**'
      - 'routes/web.php'
      - 'tests/Feature/UnifiedPersonAccountStatementTest.php'
      - '.github/workflows/unified-person-account-statement.yml'

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run unified person account statement tests
        run: php artisan test --filter=UnifiedPersonAccountStatementTest
